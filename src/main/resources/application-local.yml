server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres_kafka_app_db?currentSchema=kafka_app
    username: kafka_user_app
    password: password

  flyway:
    enabled: true
    default-schema: kafka_app
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    producer:
      bootstrap-servers: localhost:9092